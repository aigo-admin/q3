<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404</title>
  <meta name="description" content="404 - SecLeaf Flagship 3D Stunt & Physics Playground">
  <meta name="robots" content="noindex, follow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Three.js, Cannon.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="assets/js/GLTFLoader.js"></script>
  <script src="assets/js/DRACOLoader.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06080d;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Minimal HUD Overlay */
    .hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 28px;
    }

    /* Top Corner: Sound, Flag Counter & Return to Base */
    .hud-top-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #baec43;
      background: rgba(186, 236, 67, 0.12);
      border: 1px solid rgba(186, 236, 67, 0.35);
      padding: 8px 14px;
      border-radius: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 20, 28, 0.85);
      color: #f1f5f9;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn:hover {
      border-color: #baec43;
      color: #baec43;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(186, 236, 67, 0.2);
    }

    .btn-primary {
      background: #baec43;
      color: #07090e;
      border-color: #baec43;
    }

    .btn-primary:hover {
      background: #d4ff68;
      color: #07090e;
      border-color: #d4ff68;
      box-shadow: 0 6px 20px rgba(186, 236, 67, 0.35);
    }

    /* Bottom Corner: Minimal Controls */
    .hud-bottom-left {
      pointer-events: auto;
      display: flex;
      align-items: center;
    }

    .minimal-controls {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(11, 15, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #cbd5e1;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .minimal-controls:hover {
      border-color: rgba(186, 236, 67, 0.45);
      color: #ffffff;
    }

    .ctrl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #baec43;
      box-shadow: 0 0 6px #baec43;
    }

    .ctrl-sep {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Holographic Flag Pickup Toast */
    #flag-toast {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      background: rgba(11, 15, 23, 0.95);
      border: 1px solid #baec43;
      box-shadow: 0 0 35px rgba(186, 236, 67, 0.35);
      border-radius: 8px;
      padding: 14px 22px;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #flag-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .flag-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .flag-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #baec43;
      text-transform: uppercase;
    }

    .flag-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .flag-copy-btn {
      background: #baec43;
      color: #07090e;
      border: none;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .flag-copy-btn:hover {
      background: #d4ff68;
    }

    /* Mobile Virtual Controls */
    .mobile-controls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    @media (max-width: 900px), (pointer: coarse) {
      .mobile-controls {
        display: block;
      }
      .hud-bottom-left {
        display: none;
      }
      .hud {
        padding: 16px;
      }
    }

    .touch-dpad {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-actions {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: rgba(15, 20, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: #baec43;
      color: #07090e;
      border-color: #baec43;
      transform: scale(0.94);
    }

    .touch-btn.btn-gas {
      background: rgba(186, 236, 67, 0.25);
      border-color: #baec43;
      color: #baec43;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="hud">
    <!-- Top Corner: Sound, Flag Counter & Return to Base -->
    <div class="hud-top-right">
      <div class="flag-badge" id="hud-flag-badge">🚩 0/4</div>

      <button class="btn" id="btn-sound" title="Toggle Sound">
        <span id="sound-icon">🔊</span> <span id="sound-label">SOUND</span>
      </button>

      <a href="/" class="btn btn-primary" title="Return to Main Countdown">
        <span>RETURN TO BASE</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>

    <!-- Holographic CTF Flag Discovery Toast -->
    <div id="flag-toast">
      <div class="flag-info">
        <span class="flag-title" id="flag-progress">CTF FLAG RECOVERED • 1/4</span>
        <code class="flag-code" id="flag-text">SecLeaf{404_DR1V3_BY_PWN_2027}</code>
      </div>
      <button class="flag-copy-btn" id="flag-copy-btn">COPY</button>
    </div>

    <!-- Bottom Corner: Minimal Controls -->
    <div class="hud-bottom-left">
      <div class="minimal-controls" id="btn-reset" title="Click or press R to respawn car">
        <span class="ctrl-dot"></span>
        <span>WASD Drive</span>
        <span class="ctrl-sep">•</span>
        <span>Drag Orbit POV</span>
        <span class="ctrl-sep">•</span>
        <span>SPACE Hop</span>
        <span class="ctrl-sep">•</span>
        <span>SHIFT Nitro</span>
        <span class="ctrl-sep">•</span>
        <span>F EMP</span>
        <span class="ctrl-sep">•</span>
        <span>R Reset</span>
      </div>
    </div>
  </div>

  <!-- Touch Controls for Mobile / Tablets -->
  <div class="mobile-controls">
    <div class="touch-dpad">
      <button class="touch-btn" id="touch-left">◀</button>
      <button class="touch-btn" id="touch-right">▶</button>
    </div>
    <div class="touch-actions">
      <div style="display: flex; gap: 10px;">
        <button class="touch-btn" id="touch-nitro" style="font-size: 0.72rem; color: #baec43;">NITRO</button>
        <button class="touch-btn" id="touch-hop" style="font-size: 0.72rem;">HOP</button>
      </div>
      <button class="touch-btn btn-gas" id="touch-gas">▲</button>
      <div style="display: flex; gap: 10px;">
        <button class="touch-btn" id="touch-brake">▼</button>
        <button class="touch-btn" id="touch-drift" style="font-size: 0.72rem;">DRIFT</button>
      </div>
    </div>
  </div>

  <!-- Modular Game Architecture -->
  <script src="js/audio.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/vehicle.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
