<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="curve-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="776" height="316" rx="12" fill="#faf9f6" stroke="#e6e2da" stroke-width="1.5"/>
  <text x="36" y="42" fill="#18181b" font-size="16" font-weight="700">How Dynamic Scoring Works (Fair for All Skill Levels)</text>
  <text x="36" y="62" fill="#71717a" font-size="13">Challenges start at 500 points. As more teams solve them, points drop to 100.</text>

  <!-- Axes -->
  <line x1="80" y1="270" x2="720" y2="270" stroke="#d4cfc5" stroke-width="1.5"/>
  <line x1="80" y1="100" x2="80" y2="270" stroke="#d4cfc5" stroke-width="1.5"/>

  <!-- Labels Y -->
  <text x="30" y="105" fill="#71717a" font-size="11">500 pts</text>
  <text x="30" y="145" fill="#71717a" font-size="11">400 pts</text>
  <text x="30" y="185" fill="#71717a" font-size="11">300 pts</text>
  <text x="30" y="225" fill="#71717a" font-size="11">200 pts</text>
  <text x="30" y="275" fill="#71717a" font-size="11">100 pts</text>

  <!-- Labels X -->
  <text x="80" y="292" fill="#71717a" font-size="11">1 solve</text>
  <text x="230" y="292" fill="#71717a" font-size="11">15 solves</text>
  <text x="380" y="292" fill="#71717a" font-size="11">30 solves</text>
  <text x="530" y="292" fill="#71717a" font-size="11">45 solves</text>
  <text x="660" y="292" fill="#71717a" font-size="11">60+ solves (Floor)</text>

  <!-- Curve -->
  <path d="M 80 100 C 220 180, 450 260, 660 270 L 720 270 L 720 270 L 80 270 Z" fill="url(#curve-light)"/>
  <path d="M 80 100 C 220 180, 450 260, 660 270 L 720 270" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Markers -->
  <circle cx="80" cy="100" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <text x="95" y="105" fill="#15803d" font-size="12" font-weight="bold">1st Blood: 500 + 100 Bonus (600 pts!)</text>

  <circle cx="240" cy="190" r="5" fill="#2563eb"/>
  <text x="255" y="190" fill="#1d4ed8" font-size="11" font-weight="600">15 solves: 325 pts</text>

  <circle cx="660" cy="270" r="5" fill="#71717a"/>
  <text x="580" y="255" fill="#71717a" font-size="11">Floor Reached: 100 pts</text>
</svg>